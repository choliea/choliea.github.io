<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 490" role="img" aria-labelledby="title desc">
<title id="title">아무튼 실행 중 — 이상한 데스크톱</title><desc id="desc">픽셀 아트 방에서 컴퓨터를 쓰는 사람, 쌓이는 폴더, 움직이는 커서와 반복해서 나타나는 시스템 오류.</desc>
<style>
text{font-family:'Malgun Gothic','Apple SD Gothic Neo',sans-serif} .pixel{shape-rendering:crispEdges} .blink{animation:blink 1.2s steps(1) infinite}.cursor{animation:cursor 9s linear infinite}.idea{animation:idea 9s steps(1) infinite}.popup{animation:popup 9s steps(1) infinite}.folder3{animation:folders 9s steps(1) infinite}.screen{animation:screen 9s steps(1) infinite}.dot{animation:blink .7s steps(1) infinite}.head{animation:nod 2.5s steps(1) infinite;transform-origin:730px 270px}@keyframes blink{50%{opacity:0}}@keyframes cursor{0%{transform:translate(0,0)}25%{transform:translate(150px,80px)}50%{transform:translate(270px,130px)}75%{transform:translate(110px,60px)}100%{transform:translate(0,0)}}@keyframes idea{0%,23%,48%,100%{opacity:0}24%,47%{opacity:1}}@keyframes popup{0%,49%,89%,100%{opacity:0}50%,88%{opacity:1}}@keyframes folders{0%,30%{opacity:0}31%,100%{opacity:1}}@keyframes screen{0%,49%,89%,100%{opacity:1}50%,88%{opacity:.5}}@keyframes nod{0%,75%,100%{transform:rotate(0deg)}76%,82%{transform:rotate(7deg)}}@media(prefers-reduced-motion:reduce){*{animation:none!important}.popup{opacity:1}.idea{opacity:1}.folder3{opacity:1}}
</style>
<rect width="960" height="490" fill="#111827"/><rect x="12" y="12" width="936" height="466" fill="#1e293b" stroke="#9ca3af" stroke-width="4"/><rect x="25" y="25" width="910" height="38" fill="#334155"/><text x="43" y="51" fill="#f8fafc" font-size="19" font-weight="bold">▣ 아무튼 실행 중</text><text x="745" y="51" fill="#cbd5e1" font-size="15">_  □  ×</text>
<!-- wallpaper --> <rect x="25" y="63" width="910" height="363" fill="#24334b"/><path d="M25 365H935" stroke="#475569" stroke-width="3"/><rect x="25" y="365" width="910" height="61" fill="#29394e"/>
<!-- desktop icons -->
<g class="pixel"><rect x="65" y="106" width="45" height="32" fill="#e6bb5a"/><rect x="65" y="99" width="22" height="10" fill="#f6d98b"/><text x="43" y="162" fill="white" font-size="15">하고 싶은 것</text><rect x="65" y="206" width="45" height="32" fill="#e6bb5a"/><rect x="65" y="199" width="22" height="10" fill="#f6d98b"/><text x="49" y="262" fill="white" font-size="15">진행 중</text><g class="folder3"><rect x="65" y="306" width="45" height="32" fill="#e6bb5a"/><rect x="65" y="299" width="22" height="10" fill="#f6d98b"/><text x="34" y="363" fill="white" font-size="14">이건_언제?</text></g></g>
<!-- main window -->
<rect x="208" y="93" width="460" height="267" fill="#d5d9e1" stroke="#090d19" stroke-width="6"/><rect x="211" y="96" width="454" height="35" fill="#345e9b"/><text x="226" y="119" fill="#fff" font-size="17" font-weight="bold">SYSTEM / 상태 확인</text><rect x="627" y="102" width="27" height="23" fill="#e2e8f0"/><text x="634" y="120" fill="#111827" font-size="19">×</text>
<rect x="226" y="148" width="420" height="192" fill="#121c2e"/><g class="screen" fill="#a8f0bd" font-family="monospace" font-size="17"><text x="246" y="179">&gt; 사용자 연결됨</text><text x="246" y="211">&gt; 오늘의 목표: 검색 중...</text><text x="246" y="243">&gt; 새 아이디어 감지: 1건</text><text x="246" y="275">&gt; 기존 작업: 17건</text><text x="246" y="307">&gt; 아무튼 계속합니다 <tspan class="dot">_</tspan></text></g>
<!-- desk and character -->
<rect x="714" y="331" width="188" height="14" fill="#bd8b60"/><rect x="732" y="345" width="12" height="72" fill="#8d5c43"/><rect x="872" y="345" width="12" height="72" fill="#8d5c43"/><rect x="759" y="267" width="95" height="62" fill="#0c1425" stroke="#94a3b8" stroke-width="7"/><rect x="773" y="280" width="67" height="38" fill="#0d3b37"/><rect x="786" y="289" width="37" height="4" fill="#67e8a3"/><rect x="786" y="300" width="24" height="4" fill="#67e8a3"/><rect x="799" y="329" width="12" height="10" fill="#64748b"/>
<g class="head pixel"><rect x="682" y="252" width="42" height="41" fill="#f0c39c"/><rect x="678" y="245" width="48" height="15" fill="#392e42"/><rect x="716" y="266" width="5" height="5" fill="#222"/></g><rect x="669" y="294" width="63" height="53" fill="#a78bfa"/><rect x="725" y="311" width="49" height="12" fill="#f0c39c"/><rect x="671" y="347" width="28" height="42" fill="#475569"/><rect x="703" y="347" width="28" height="42" fill="#475569"/>
<g class="idea"><rect x="670" y="172" width="56" height="57" rx="7" fill="#fff5c2"/><text x="682" y="213" font-size="34">!</text><path d="M692 229l-5 14 17-14" fill="#fff5c2"/></g>
<!-- popup -->
<g class="popup"><rect x="318" y="170" width="405" height="160" fill="#e2e8f0" stroke="#080f1f" stroke-width="6"/><rect x="321" y="173" width="399" height="31" fill="#a12438"/><text x="336" y="195" font-size="17" fill="white" font-weight="bold">⚠ 시스템 알림</text><text x="339" y="239" font-size="18" fill="#111827">새 프로젝트가 생성되었습니다.</text><text x="339" y="269" font-size="16" fill="#334155">기존 프로젝트: 17개 (변동 없음)</text><rect x="476" y="285" width="90" height="30" fill="#b9c4d2" stroke="#334155" stroke-width="2"/><text x="501" y="306" fill="#111827" font-size="16">확인</text></g>
<!-- cursor --> <g class="cursor"><path d="M405 197v28l8-8 8 14 7-4-8-13h13z" fill="white" stroke="#111827" stroke-width="3"/></g>
<!-- taskbar --> <rect x="25" y="426" width="910" height="39" fill="#334155"/><rect x="35" y="433" width="94" height="26" fill="#64748b"/><text x="47" y="452" fill="#fff" font-size="16">▶ 시작</text><text x="155" y="451" fill="#cbd5e1" font-size="14">열린 창 18개 · 저장 여부 불명</text><text x="816" y="451" fill="#fff" font-size="14">??:??</text>
</svg>
